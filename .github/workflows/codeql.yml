name: "CodeQL 程式碼分析"

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '30 2 * * 1'  # 每週一 02:30 UTC 執行

permissions:
  contents: read

jobs:
  analyze:
    name: 分析程式碼
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@9e907b5e64f6b83e7804b09294d44122997950d6 # v4
        with:
          languages: javascript-typescript
          queries: +security-and-quality

      - name: 自動建置
        uses: github/codeql-action/autobuild@9e907b5e64f6b83e7804b09294d44122997950d6 # v4

      - name: 執行 CodeQL 分析
        uses: github/codeql-action/analyze@9e907b5e64f6b83e7804b09294d44122997950d6 # v4
        with:
          category: "/language:javascript-typescript"
