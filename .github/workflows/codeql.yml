name: "CodeQL 程式碼分析"

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'  # 每週一 02:30 UTC 執行

permissions:
  contents: read

jobs:
  analyze:
    name: 分析程式碼
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          queries: +security-and-quality

      - name: 自動建置
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

      - name: 執行 CodeQL 分析
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"
