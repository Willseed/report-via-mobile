name: Sync site update date

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-site-update-date
  cancel-in-progress: false

jobs:
  sync-date:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # Dispatch required checks for the automation branch.
      contents: write # Push the generated date-update branch.
      pull-requests: write # Create or reuse the date-update pull request.

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate update metadata
        id: metadata
        run: |
          report_update_date=$(TZ=Asia/Taipei date +%F)
          report_update_branch="automation/site-update-date-${report_update_date//-/}"
          echo "date=${report_update_date}" >> "$GITHUB_OUTPUT"
          echo "branch=${report_update_branch}" >> "$GITHUB_OUTPUT"

      - name: Update source dates
        env:
          REPORT_UPDATE_DATE: ${{ steps.metadata.outputs.date }}
        run: |
          perl -pi -e \
            's/更新日期：\K\d{4}-\d{2}-\d{2}/$ENV{REPORT_UPDATE_DATE}/' \
            src/index.html public/index.md src/app/i18n/zh-TW.ts

      - name: Detect source changes
        id: changes
        env:
          REPORT_UPDATE_DATE: ${{ steps.metadata.outputs.date }}
        run: |
          if git diff --quiet -- src/index.html public/index.md src/app/i18n/zh-TW.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Source dates already use ${REPORT_UPDATE_DATE}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit date update branch
        if: steps.changes.outputs.changed == 'true'
        env:
          REPORT_UPDATE_BRANCH: ${{ steps.metadata.outputs.branch }}
          REPORT_UPDATE_DATE: ${{ steps.metadata.outputs.date }}
        run: |
          report_remote_ref=$(git ls-remote --heads origin "refs/heads/${REPORT_UPDATE_BRANCH}")
          report_remote_sha=$(printf '%s\n' "$report_remote_ref" | awk '{print $1}')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$REPORT_UPDATE_BRANCH"
          git add src/index.html public/index.md src/app/i18n/zh-TW.ts
          git commit -m "chore: update site date to ${REPORT_UPDATE_DATE}"

          if [ -n "$report_remote_sha" ]; then
            git push \
              --force-with-lease="refs/heads/${REPORT_UPDATE_BRANCH}:${report_remote_sha}" \
              origin "HEAD:refs/heads/${REPORT_UPDATE_BRANCH}"
          else
            git push --set-upstream origin "$REPORT_UPDATE_BRANCH"
          fi

      - name: Create or update pull request
        id: pull-request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_UPDATE_BRANCH: ${{ steps.metadata.outputs.branch }}
          REPORT_UPDATE_DATE: ${{ steps.metadata.outputs.date }}
        run: |
          report_pr_number=$(gh pr list \
            --base main \
            --head "$REPORT_UPDATE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$report_pr_number" ]; then
            report_pr_body="CI 偵測到來源檔的更新日期已過期。"
            report_pr_body="${report_pr_body} 此 PR 同步更新預載頁、Markdown 首頁與 Angular 畫面的日期，並保留 main 的審查與必要檢查。"
            report_pr_url=$(gh pr create \
              --base main \
              --head "$REPORT_UPDATE_BRANCH" \
              --title "chore: 更新網站日期至 ${REPORT_UPDATE_DATE}" \
              --body "$report_pr_body")
          else
            report_pr_url=$(gh pr view "$report_pr_number" --json url --jq '.url')
          fi

          echo "url=${report_pr_url}" >> "$GITHUB_OUTPUT"
          echo "Date update PR: ${report_pr_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch required checks
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_UPDATE_BRANCH: ${{ steps.metadata.outputs.branch }}
        run: |
          gh workflow run ci.yml --ref "$REPORT_UPDATE_BRANCH"
          gh workflow run e2e.yml --ref "$REPORT_UPDATE_BRANCH"
          gh workflow run codeql.yml --ref "$REPORT_UPDATE_BRANCH"
          gh workflow run codacy.yml --ref "$REPORT_UPDATE_BRANCH"
