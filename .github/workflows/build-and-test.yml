name: Build & Test

on:
  workflow_call:
    outputs:
      artifact-name:
        description: Production build artifact name.
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: production-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Restore Angular CLI artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json', 'angular.json', 'ngsw-config.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('package-lock.json', 'angular.json', 'ngsw-config.json', 'tsconfig*.json') }}-

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run lint
        run: npm run lint

      - name: Run style lint
        run: npm run lint:styles

      - name: Run Tests
        run: npm run test:coverage

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/report-via-mobile/lcov.info

      - name: Set reproducible build metadata
        run: |
          report_source_date_epoch=$(git log -1 --format=%ct HEAD)
          report_build_date=$(TZ=Asia/Taipei node -e \
            'process.stdout.write(new Date(Number(process.argv[1]) * 1000).toLocaleDateString("en-CA"))' \
            "$report_source_date_epoch")
          echo "SOURCE_DATE_EPOCH=${report_source_date_epoch}" >> "$GITHUB_ENV"
          echo "REPORT_BUILD_DATE=${report_build_date}" >> "$GITHUB_ENV"

      - name: Update site date
        run: |
          perl -pi -e \
            's/📅 更新日期：\d{4}-\d{2}-\d{2}/📅 更新日期：$ENV{REPORT_BUILD_DATE}/' \
            src/index.html public/index.md src/app/i18n/zh-TW.ts

      - name: Build
        run: npm run build -- --configuration production

      - name: Verify build metadata
        run: |
          grep -Fxq \
            '  <meta name="mobile-web-app-capable" content="yes">' \
            dist/report-via-mobile/browser/index.html
          grep -Fxq \
            "    <p>📅 更新日期：${REPORT_BUILD_DATE}</p>" \
            dist/report-via-mobile/browser/index.html
          grep -Fxq \
            "📅 更新日期：${REPORT_BUILD_DATE}" \
            dist/report-via-mobile/browser/index.md
          grep -RFq \
            --include='*.js' \
            "📅 更新日期：${REPORT_BUILD_DATE}" \
            dist/report-via-mobile/browser

      - name: Save Angular CLI artifacts
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json', 'angular.json', 'ngsw-config.json', 'tsconfig*.json') }}-${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-build
          path: dist/report-via-mobile/browser
