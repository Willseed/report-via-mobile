name: ZAP Full Scan

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap_full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Restore Angular CLI artifacts
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json', 'angular.json', 'ngsw-config.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-angular-${{ hashFiles('package-lock.json', 'angular.json', 'ngsw-config.json', 'tsconfig*.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npx ng build --configuration production

      - name: Save Angular CLI artifacts
        if: ${{ !cancelled() }}
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-${{ hashFiles('package-lock.json', 'angular.json', 'ngsw-config.json', 'tsconfig*.json') }}-${{ github.sha }}

      - name: Start static file server
        run: |
          python3 .github/scripts/serve-static-no-server-header.py --port 4200 --directory dist/report-via-mobile/browser > /tmp/serve.log 2>&1 &
          echo $! > /tmp/serve.pid

      - name: Wait for server ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4200/ > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          cat /tmp/serve.log
          exit 1

      - name: ZAP full scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: http://localhost:4200/
          rules_file_name: .zap/rules.tsv
          cmd_options: "-m 30 -j"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-full

      - name: Convert ZAP JSON to SARIF
        if: always() && hashFiles('report_json.json') != ''
        run: node --no-warnings --experimental-strip-types .github/scripts/zap-to-sarif.ts report_json.json zap-results.sarif .zap/rules.tsv

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('zap-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          sarif_file: zap-results.sarif
          category: zap-full

      - name: Upload HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: zap-full-html
          path: report_html.html
