name: Bug report
description: Report a reproducible defect in the app or repository workflow.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. For security vulnerabilities, please **do not** use this form—see SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, OS, browser, and app mode if known (for example PWA vs browser tab).
      placeholder: iPhone 16 / iOS 19 / Safari / PWA
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else that may help.
